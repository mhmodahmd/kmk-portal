<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>KMK One — خيارات الشعار</title>
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f6f8;color:#1f2328;padding:24px}
h1{font-size:22px;margin:0 0 4px}p.s{margin:0 0 20px;color:#5b616b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:18px;border:1px solid #e3e5e9;border-radius:12px;overflow:hidden}
.cell{padding:28px 24px;display:flex;align-items:center;justify-content:center;min-height:130px}
.l{background:#fff}.d{background:#232323}
.cell img{max-width:100%;height:76px;width:auto}
.t{grid-column:1/-1;padding:10px 16px;background:#fff;border-bottom:1px solid #e3e5e9;font-size:14px}
.t b{font-size:16px}
</style></head><body>
<h1>KMK One — خيارات الشعار</h1><p class="s">كلمة ONE بالأسلوب البكسلي نفسه، نهاري وليلي</p>
<div class="row"><div class="t"><b>A</b> · ONE صغيرة على خط الأساس بعد KMK</div><div class="cell l"><img src="kmk-one-A-light.svg"></div><div class="cell d"><img src="kmk-one-A-dark.svg"></div></div>
<div class="row"><div class="t"><b>B</b> · ONE أسفل الشعار موزّعة على عرضه</div><div class="cell l"><img src="kmk-one-B-light.svg"></div><div class="cell d"><img src="kmk-one-B-dark.svg"></div></div>
<div class="row"><div class="t"><b>C</b> · شارة ONE بجانب الشعار</div><div class="cell l"><img src="kmk-one-C-light.svg"></div><div class="cell d"><img src="kmk-one-C-dark.svg"></div></div>
<div class="row"><div class="t"><b>D</b> · ONE مع مؤشر الكتابة الأحمر (مثل مؤشر تحميل البوابة)</div><div class="cell l"><img src="kmk-one-D-light.svg"></div><div class="cell d"><img src="kmk-one-D-dark.svg"></div></div>
<div class="row"><div class="t"><b>E</b> · ONE عمودية بجانب الشعار</div><div class="cell l"><img src="kmk-one-E-light.svg"></div><div class="cell d"><img src="kmk-one-E-dark.svg"></div></div>
</body></html>
